<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蓝云服 - 连接信息</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 60px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 600px;
            width: 90%;
        }
        
        .logo {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        
        .title {
            font-size: 2.2rem;
            margin-bottom: 30px;
            font-weight: 600;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        .info-box {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .ip {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 10px 0;
            color: #fff;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.4);
        }
        
        .port {
            font-size: 2rem;
            font-weight: 600;
            color: #ffd700;
            margin: 15px 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        
        .label {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        
        .copy-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
            font-weight: 500;
        }
        
        .copy-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        
        .status {
            margin-top: 20px;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            .title {
                font-size: 1.8rem;
            }
            
            .ip {
                font-size: 2rem;
            }
            
            .port {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">☁️</div>
        <h1 class="title">蓝云服连接信息</h1>
        
        <div class="info-box">
            <div class="label">服务器地址</div>
            <div class="ip">103.239.245.225</div>
        </div>
        
        <div class="info-box">
            <div class="label">端口</div>
            <div class="port">15315</div>
        </div>
        
        <button class="copy-btn" onclick="copyInfo()">📋 点击复制IP端口</button>
        
        <p class="status">服务器状态：正常运行中</p>
    </div>

    <script>
        function copyInfo() {
            const info = "103.239.245.225:15315";
            navigator.clipboard.writeText(info).then(() => {
                const btn = document.querySelector('.copy-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = "✅ 已复制！";
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 2000);
            }).catch(err => {
                console.error('复制失败: ', err);
                alert('复制失败，请手动选择复制');
            });
        }
    </script>
</body>
</html>
